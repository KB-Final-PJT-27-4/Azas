name: Validate PR branch flow

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  validate:
    name: Validate branch flow
    runs-on: ubuntu-latest
    steps:
      - name: Validate allowed source and target branches
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          allowed=false

          case "$BASE_REF" in
            dev-be)
              [[ "$HEAD_REF" == BE/feature/* || \
                 "$HEAD_REF" == BE/fix/* || \
                 "$HEAD_REF" == BE/chore/* || \
                 "$HEAD_REF" == BE/docs/* || \
                 "$HEAD_REF" == BE/refactor/* || \
                 "$HEAD_REF" == BE/style/* || \
                 "$HEAD_REF" == BE/test/* || \
                 "$HEAD_REF" == dev ]] && allowed=true
              ;;
            dev-fe)
              [[ "$HEAD_REF" == FE/feature/* || \
                 "$HEAD_REF" == FE/fix/* || \
                 "$HEAD_REF" == FE/chore/* || \
                 "$HEAD_REF" == FE/docs/* || \
                 "$HEAD_REF" == FE/refactor/* || \
                 "$HEAD_REF" == FE/style/* || \
                 "$HEAD_REF" == FE/test/* || \
                 "$HEAD_REF" == dev ]] && allowed=true
              ;;
            dev)
              [[ "$HEAD_REF" == dev-be || "$HEAD_REF" == dev-fe || "$HEAD_REF" == main ]] && allowed=true
              ;;
            main)
              [[ "$HEAD_REF" == dev || "$HEAD_REF" == hotfix/* ]] && allowed=true
              ;;
            *)
              allowed=true
              ;;
          esac

          if [[ "$allowed" != true ]]; then
            echo "Invalid PR branch flow: $HEAD_REF -> $BASE_REF"
            echo "Allowed flows:"
            echo "  BE/{feature,fix,chore,docs,refactor,style,test}/* -> dev-be"
            echo "  FE/{feature,fix,chore,docs,refactor,style,test}/* -> dev-fe"
            echo "  dev-be, dev-fe, or main -> dev"
            echo "  dev or hotfix/* -> main"
            exit 1
          fi
