name: Validate PR branch flow

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  validate:
    name: Validate branch flow
    runs-on: ubuntu-latest
    steps:
      - name: Validate allowed source and target branches
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          allowed=false

          case "$BASE_REF" in
            dev-be)
              [[ "$HEAD_REF" == BE/feature/* || "$HEAD_REF" == BE/fix/* || "$HEAD_REF" == dev ]] && allowed=true
              ;;
            dev-fe)
              [[ "$HEAD_REF" == FE/feature/* || "$HEAD_REF" == FE/fix/* || "$HEAD_REF" == dev ]] && allowed=true
              ;;
            dev)
              [[ "$HEAD_REF" == dev-be || "$HEAD_REF" == dev-fe || "$HEAD_REF" == main ]] && allowed=true
              ;;
            main)
              [[ "$HEAD_REF" == dev || "$HEAD_REF" == hotfix/* ]] && allowed=true
              ;;
            *)
              allowed=true
              ;;
          esac

          if [[ "$allowed" != true ]]; then
            echo "Invalid PR branch flow: $HEAD_REF -> $BASE_REF"
            echo "Allowed flows:"
            echo "  BE/feature/* or BE/fix/* -> dev-be"
            echo "  FE/feature/* or FE/fix/* -> dev-fe"
            echo "  dev-be, dev-fe, or main -> dev"
            echo "  dev or hotfix/* -> main"
            exit 1
          fi
