name: Backend CI/CD

on:
  pull_request:
    branches: [dev-be]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  push:
    branches: [dev-be]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  BACKEND_DIR: backend
  WAR_NAME: backend-1.0-SNAPSHOT.war
  HEALTH_URL: https://api.43-202-193-156.sslip.io/api/v1/health

jobs:
  build:
    name: Test and build WAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    env:
      ACCOUNT_NUMBER_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PHONE_NUMBER_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      PHONE_VERIFICATION_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DB_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      DB_URL: jdbc:mysql://localhost:3306/azas
      DB_USERNAME: test
      DB_PASSWORD: test
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      KAKAO_CLIENT_ID: test
      KAKAO_CLIENT_SECRET: test
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: "3600"
      REFRESH_TOKEN_EXPIRATION_SECONDS: "1209600"
      FAMILY_INVITATION_DEFAULT_EXPIRE_HOURS: "24"
      FAMILY_INVITATION_URL_BASE: http://localhost:5173/family-invitations
      NCP_SENS_ACCESS_KEY: test
      NCP_SENS_SECRET_KEY: test
      NCP_SENS_SENDER_NUMBER: "01000000000"
      NCP_SENS_SERVICE_ID: test
      S3_BUCKET: test-bucket
      AWS_REGION: ap-northeast-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Run tests and build WAR
        run: ./gradlew test war --no-daemon

      - name: Verify WAR
        run: test -s "build/libs/${WAR_NAME}"

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-war-${{ github.sha }}
          path: backend/build/libs/${{ env.WAR_NAME }}
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to EC2
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/dev-be') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev-be')
    runs-on: [self-hosted, linux, x64, backend]
    timeout-minutes: 10
    concurrency:
      group: backend-production-deploy
      cancel-in-progress: false
    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-war-${{ github.sha }}
          path: deploy

      - name: Stage WAR for deployment
        run: install -m 0600 "deploy/${WAR_NAME}" /tmp/azas-ROOT.war

      - name: Deploy WAR and verify internal health
        run: sudo /usr/local/sbin/deploy-azas-backend

      - name: Verify external HTTPS health
        run: |
          health_ok=false
          for _ in $(seq 1 15); do
            if curl -fsS "$HEALTH_URL" | jq -e '.status == "UP"' >/dev/null; then
              health_ok=true
              break
            fi
            sleep 2
          done

          if [ "$health_ok" != true ]; then
            echo "External health check failed: $HEALTH_URL"
            exit 1
          fi

      - name: Deployment summary
        run: |
          {
            echo "## Backend deployment completed"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Health: ${HEALTH_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove staged WAR
        if: always()
        run: rm -f /tmp/azas-ROOT.war
