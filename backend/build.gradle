plugins {
    id 'java'
    id 'war'
}

group = 'com.azas'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

def springVersion = '5.3.37'
def springSecurityVersion = '5.8.13'
def jacksonVersion = '2.21.2'
def jjwtVersion = '0.13.0'
def lombokVersion = '1.18.46'
def awsSdkVersion = '2.47.3'
def firebaseAdminVersion = '9.10.0'
def googleHttpClientVersion = '2.1.0'
def hikariCpVersion = '5.1.0'

dependencies {
    // Spring Legacy 웹 MVC 및 데이터 접근
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"

    // 인증·인가 및 소셜 OAuth
    implementation "org.springframework.security:spring-security-web:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-config:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-oauth2-client:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-oauth2-jose:${springSecurityVersion}"

    // MyBatis 및 MySQL 연결
    implementation 'org.mybatis:mybatis:3.4.6'
    implementation 'org.mybatis:mybatis-spring:1.3.2'
    implementation "com.zaxxer:HikariCP:${hikariCpVersion}"
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'

    // REST API JSON 직렬화·역직렬화
    implementation platform("com.fasterxml.jackson:jackson-bom:${jacksonVersion}")
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // 요청 DTO 입력값 검증
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    runtimeOnly 'org.glassfish:javax.el:3.0.1-b12'

    // Access Token 및 Refresh Token JWT 처리
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 서버에서 등록된 웹·앱 기기로 FCM 푸시 메시지 발송
    implementation(
            "com.google.firebase:firebase-admin:${firebaseAdminVersion}"
    ) {
        // Spring Security 5.8의 OAuth Nimbus 9.x와 Firebase Auth용
        // Nimbus 10.x가 충돌한다. 현재는 FCM Messaging만 사용한다.
        exclude group: 'com.nimbusds', module: 'nimbus-jose-jwt'
        // FCM 발송에 사용하지 않는 Firebase Storage·Firestore 의존성이
        // WAR 크기와 Spring MVC 메시지 컨버터에 영향을 주지 않게 한다.
        exclude group: 'com.google.cloud', module: 'google-cloud-storage'
        exclude group: 'com.google.cloud', module: 'google-cloud-firestore'
    }
    // Firebase 프로필 활성화 시 사용하는 JacksonFactory를 외부 Tomcat이
    // 아니라 배포 WAR의 WEB-INF/lib에서 제공한다.
    runtimeOnly "com.google.http-client:google-http-client-jackson2:${googleHttpClientVersion}"

    // Tomcat 배포 WAR에서 SLF4J 로그를 실제로 기록하는 provider
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'

    // 타임캡슐 이미지·영상은 비공개 S3 객체로 저장하고 Presigned URL로만 접근
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sso'
    implementation 'software.amazon.awssdk:ssooidc'

    // Swagger API 문서화
    implementation 'io.springfox:springfox-swagger2:3.0.0'
    implementation 'io.springfox:springfox-swagger-ui:3.0.0'

    // 반복 코드 생성을 줄이기 위한 Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Tomcat 9가 런타임에 제공하는 Servlet API
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'

    // 단위·통합 테스트
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'com.jayway.jsonpath:json-path:2.10.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.12.0'
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.springframework.security:spring-security-test:${springSecurityVersion}"
    testCompileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'javax.servlet:javax.servlet-api:4.0.1'
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
